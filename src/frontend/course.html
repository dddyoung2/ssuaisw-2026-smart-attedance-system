<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>과목 홈</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/api.js" defer></script>
  <script src="js/course.js" defer></script>
</head>
<body>
  <main class="page wide">
    <div class="top-bar">
      <a href="index.html">← 뒤로</a>
    </div>

    <p class="course-name" id="courseName">과목 정보를 불러오는 중…</p>

    <div class="section-head">
      <h1>출결 체크</h1>
      <div class="seg" role="group" aria-label="회차 정렬">
        <button type="button" data-sort="date" aria-pressed="true">수업일순</button>
        <button type="button" data-sort="week" aria-pressed="false">주차순</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="lecture-table">
        <thead>
          <tr><th class="week">주차</th><th>수업일</th><th class="action">출결 체크</th></tr>
        </thead>
        <tbody id="lectureList"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
