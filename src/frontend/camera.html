<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카메라 출결</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/api.js" defer></script>
  <script src="js/camera.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="top-bar">
      <a href="index.html">← 뒤로</a>
      <a href="attendance.html">출결 현황 보기</a>
    </div>

    <!-- 강의실·카메라 선택 → 오늘 수업 회차 확인 -->
    <section class="room-select">
      <div class="room-head">
        <div>
          <div class="label" id="roomLabel">강의실 · 수업</div>
          <div class="value" id="roomValue">강의실을 선택해 주세요</div>
        </div>
        <button class="btn" type="button" id="roomBtn" aria-expanded="true">강의실 선택</button>
      </div>

      <div class="room-panel open" id="roomPanel">
        <div class="fields single">
          <div>
            <label for="room">강의실 · 카메라</label>
            <select id="room"></select>
          </div>
        </div>
        <button class="btn full" type="button" id="findLecture">오늘 수업 찾기</button>

        <!-- 같은 강의실·같은 날에 수업이 여러 개면 교수가 고른다 -->
        <div class="fields single lecture-pick" id="lecturePick" hidden>
          <div>
            <label for="lecture">오늘 이 강의실의 수업</label>
            <select id="lecture"></select>
          </div>
          <button class="btn full" type="button" id="applyLecture">이 수업으로 출결 시작</button>
        </div>

        <p class="room-msg" id="roomMsg" role="status"></p>
      </div>
    </section>

    <!-- 카메라 화면 -->
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-msg" id="cameraMsg">카메라 연결 중…</div>
      <span class="rec-badge" id="recBadge">촬영 중</span>
      <div class="flash" id="flash"></div>
    </div>

    <button class="btn full" type="button" id="shootBtn" disabled>촬영 시작</button>
    <p class="shoot-info" id="shootInfo">수업을 고르면 촬영을 시작할 수 있어요. 촬영하면 1분마다 자동으로 출석을 확인해요.</p>

    <!-- 캡처용. 크기는 촬영할 때 카메라의 실제 해상도로 맞춘다 (camera.js) -->
    <canvas id="canvas" hidden></canvas>
  </main>
</body>
</html>
