<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카메라 출결</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/api.js" defer></script>
  <script src="js/camera.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="top-bar">
      <a href="method.html" id="backLink">← 뒤로</a>
      <a href="attendance.html" id="attendanceLink">출결 현황 보기</a>
    </div>

    <p class="lecture-info" id="lectureInfo">수업 정보를 불러오는 중…</p>

    <!-- 강의실 선택: 어느 강의실 카메라로 찍을지만 고른다 (DB 의 수업 정보는 바꾸지 않음) -->
    <section class="room-select">
      <div class="room-head">
        <div>
          <div class="label">촬영 강의실</div>
          <div class="value" id="roomValue">-</div>
        </div>
        <button class="btn" type="button" id="roomBtn" aria-expanded="false" aria-controls="roomPanel">강의실 변경</button>
      </div>

      <div class="room-panel" id="roomPanel">
        <div class="fields single">
          <div>
            <label for="room">강의실</label>
            <select id="room"></select>
          </div>
        </div>
      </div>

      <p class="room-msg" id="roomMsg" role="status"></p>
    </section>

    <!-- 카메라 화면 -->
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-msg" id="cameraMsg">카메라 연결 중…</div>
      <span class="rec-badge" id="recBadge">촬영 중</span>
      <div class="flash" id="flash"></div>
    </div>

    <!-- 지각 인정 시간: 촬영 시작 후 이 시간이 지나면 한 번 더 촬영한다 -->
    <div class="late-select">
      <label for="lateMin">지각 인정 시간 <span class="hint">촬영 시작 후</span></label>
      <select id="lateMin"></select>
    </div>

    <button class="btn full" type="button" id="shootBtn" disabled>촬영 시작</button>
    <p class="shoot-info" id="shootInfo">촬영을 시작하면 5분마다, 그리고 지각 인정 시간이 지났을 때 자동으로 출석을 확인해요.</p>

    <!-- 캡처용. 크기는 촬영할 때 카메라의 실제 해상도로 맞춘다 (camera.js) -->
    <canvas id="canvas" hidden></canvas>
  </main>
</body>
</html>
